<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <h2 style="text-align:center;color:white;">Shopping Cart</h2>

    <div id="cart-items"></div>
    <div id="checkout-actions" class="checkout-actions"></div>
    <div id="checkout-main" class="checkout-main" style="display:none;">
        <div class="checkout-summary" id="checkout-summary"></div>
        <div class="checkout-form-section">
            <h2>Checkout</h2>
            <div class="auth-panel" id="auth-panel">
                <p id="auth-message" class="auth-message">Sign in or create an account to continue checkout.</p>

                <div class="auth-toggle" role="tablist" aria-label="Account options">
                    <button type="button" class="auth-toggle-btn active" data-mode="signin">Sign In</button>
                    <button type="button" class="auth-toggle-btn" data-mode="signup">Create Account</button>
                </div>

                <div class="auth-section" id="signin-section">
                    <form id="login-form" class="auth-form">
                        <label for="login-email">Email</label>
                        <input id="login-email" name="email" type="email" placeholder="you@example.com" required>

                        <label for="login-password">Password</label>
                        <input id="login-password" name="password" type="password" placeholder="Your password" required>

                        <button type="submit">Sign In</button>
                    </form>
                </div>

                <div class="auth-section hidden" id="signup-section">
                    <form id="signup-form" class="auth-form">
                        <label for="signup-name">Full Name</label>
                        <input id="signup-name" name="name" type="text" placeholder="John Doe" required>

                        <label for="signup-email">Email</label>
                        <input id="signup-email" name="email" type="email" placeholder="you@example.com" required>

                        <label for="signup-password">Password</label>
                        <input id="signup-password" name="password" type="password" placeholder="Choose a password"
                            required>

                        <button type="submit">Create Account</button>
                    </form>
                </div>

                <div class="social-auth">
                    <button type="button" class="social-btn" data-provider="google">
                        <span class="social-btn-content">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#4285F4"
                                    d="M21.6 12.23c0-.79-.07-1.54-.2-2.27H12v4.3h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.98-4.33 2.98-7.55Z" />
                                <path fill="#34A853"
                                    d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.24-2.5c-.9.6-2.05.95-3.38.95-2.6 0-4.8-1.76-5.59-4.12H2.98v2.58A10 10 0 0 0 12 22Z" />
                                <path fill="#FBBC05"
                                    d="M6.41 12.9A6.02 6.02 0 0 1 6.41 9.1V6.52H2.98a10 10 0 0 0 0 12.77l3.43-2.39Z" />
                                <path fill="#EA4335"
                                    d="M12 5.98c1.47 0 2.79.5 3.83 1.48l2.87-2.87A9.96 9.96 0 0 0 12 2a10 10 0 0 0-9.02 5.52l3.43 2.58C7.2 7.74 9.4 5.98 12 5.98Z" />
                            </svg>
                            <span>Continue with Google</span>
                        </span>
                    </button>
                    <button type="button" class="social-btn" data-provider="apple">
                        <span class="social-btn-content">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="currentColor"
                                    d="M16.5 12.3c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.6-1.6-3.2-1.6-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.8-.4 6.9 1.1 9.2.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7 1.4 0 1.8.7 3 .7 1.2 0 2-.9 2.8-2.2.9-1.2 1.2-2.4 1.2-2.5-.1-.1-2.3-.9-2.3-3.5Z" />
                                <path fill="currentColor"
                                    d="M14.8 5.4c.6-.7 1-.7 1.6-1.1-.9-1-2.2-1.8-3.4-1.8-1.1 0-1.6.4-2.4.8-.7.4-1.3.8-2.2.8-.9 0-1.8-.3-2.4-.8-.7-.5-1.3-.9-2.1-.9C4.1 3.4 2.5 4.8 1.8 6.7c-.6 1.4-.7 3.1-.2 4.7.5 1.5 1.4 3 2.6 4.2.9.9 1.9 1.9 3.2 1.9 1.2 0 1.5-.6 2.9-.6 1.4 0 1.6.6 3 .6 1.2 0 2-.8 2.9-1.8 1.2-1.2 1.7-2.7 1.8-2.8-.1-.1-1.4-.6-1.4-2.4 0-1.5.7-2.2 1.2-2.6-.8-1.1-2.1-1.2-2.6-1.2Z" />
                            </svg>
                            <span>Continue with Apple</span>
                        </span>
                    </button>
                </div>

                <button type="button" id="logout-btn" class="ghost-btn hidden">Sign Out</button>
            </div>

            <div id="checkout-wrapper" class="checkout-wrapper">
                <form id="checkout-form" class="checkout-form">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" type="text" placeholder="John Doe" required>

                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>

                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="tel" placeholder="08012345678" required>

                    <label for="address">Delivery Address</label>
                    <textarea id="address" name="address" placeholder="123 Lagos Street, Abuja"></textarea>
                    <small id="shipping-help" style="color:#e2e8f0;">Pickup orders do not need a delivery
                        address.</small>

                    <label for="shipping">Shipping Method</label>
                    <select id="shipping" name="shipping">
                        <option value="standard">Standard Delivery</option>
                        <option value="express">Express Delivery</option>
                        <option value="pickup">Pickup</option>
                    </select>

                    <label for="payment-method">Payment Method</label>
                    <select id="payment-method" name="paymentMethod">
                        <option value="paystack">Paystack</option>
                    </select>

                    <div class="payment-info" id="payment-info">
                        Pay securely with Paystack. A secure checkout popup will open after you submit your order.
                    </div>

                    <div class="payment-actions">
                        <button type="submit">Place Order</button>
                        <button type="button" id="paystack-btn" class="ghost-btn">Pay with Paystack</button>
                    </div>
                </form>
            </div>
            <div class="confirmation-message" id="confirmation-message"></div>
        </div>
    </div>

    <h2 style="text-align:center;color:white;">
        Total: ₦<span id="total">0</span>
    </h2>

    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="cart.js?v=20260713"></script>

</body>

</html>
