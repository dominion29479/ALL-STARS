<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paystack Checkout</title>
</head>

<body>
    <h1>Paystack Checkout</h1>
    <form id="checkout-form">
        <input name="name" placeholder="Name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="amount" type="number" min="1" placeholder="Amount (NGN)" required />
        <button type="submit">Pay with Paystack</button>
    </form>
    <div id="message"></div>

    <script>
        const form = document.getElementById("checkout-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";

            const formData = new FormData(form);
            const payload = {
                name: formData.get("name"),
                email: formData.get("email"),
                amount: formData.get("amount"),
            };

            const response = await fetch("/api/initialize-payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent = data.message || data.error || "Failed to initialize payment.";
                return;
            }

            window.location.href = data.data.authorization_url;
        });
    </script>
</body>

</html>
