<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .login-box {
            background: rgba(255, 255, 255, .08);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .2);
            width: 100%;
            max-width: 420px
        }

        .login-box h2 {
            color: #fff;
            margin: 0 0 12px
        }

        .login-box label {
            color: #fff;
            font-weight: 600
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .15);
            background: transparent;
            color: #fff;
            margin-bottom: 12px
        }

        .login-box button {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            background: #22d3ee;
            color: #000;
            font-weight: 700
        }

        .login-error {
            color: #ffb4b4;
            margin-top: 8px
        }
    </style>
</head>

<body>
    <header>
        <h1>Admin Login</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main class="login-wrapper">
        <div class="login-box">
            <h2>Sign in to Admin</h2>
            <form id="login-form">
                <label for="username">Username</label>
                <input id="username" name="username" placeholder="ADMIN" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
                <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>
            </form>
        </div>
    </main>
    <script>
        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');
        const ADMIN_USER = 'ADMIN';
        const ADMIN_PASS = 'Missed@1206';

        function isLoggedIn() {
            return sessionStorage.getItem('admin_logged') === '1';
        }

        if (isLoggedIn()) {
            window.location.href = '/admin.html';
        }

        form.addEventListener('submit', (ev) => {
            ev.preventDefault();
            const username = (form.username.value || '').trim();
            const password = form.password.value || '';
            if (username === ADMIN_USER && password === ADMIN_PASS) {
                sessionStorage.setItem('admin_logged', '1');
                window.location.href = '/admin.html';
                return;
            }
            errorEl.textContent = 'Invalid username or password.';
        });
    </script>
</body>

</html>
